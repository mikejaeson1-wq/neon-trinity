name: Mithördienst live prüfen
on:
  push:
    branches: [main]
    paths: [supabase/functions/neon-public/**, supabase/listen-private.sql, .github/workflows/listen-service-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Erreichbarkeit und anonyme Zugriffsgrenzen prüfen
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {CLOUD} from './app/cloud-config.mjs';
          const request=async(path,method='GET',body)=>{
            const r=await fetch(CLOUD.url+'/functions/v1/neon-public'+path,{method,headers:{apikey:CLOUD.key,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(15000),cache:'no-store'});
            return {status:r.status,data:await r.json()};
          };
          const health=await request('/health');
          assert.equal(health.status,200);assert.equal(health.data.ready,true);assert.equal(health.data.privateListening,true);
          assert.equal((await request('/listen/'+'0'.repeat(64))).status,410);
          assert.equal((await request('/listen/not-a-room')).status,404);
          assert.equal((await request('/listen-media','POST',{trackId:'check',title:'Check',artist:'Check',duration:1,byteSize:3})).status,401);
          console.log('Live-Mithördienst erreichbar; ungültige und abgelaufene Links gesperrt; anonyme Uploads abgewiesen. Keine Testdateien angelegt.');
          NODE
