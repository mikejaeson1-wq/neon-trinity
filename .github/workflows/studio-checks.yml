name: Studio-Gesamtupdate prüfen
on:
  push:
    branches: [studio-1.0, studio-qol-1.1]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: studio-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build:web
      - name: Windows-Installer ohne Veröffentlichung bauen
        if: runner.os == 'Windows'
        run: pnpm run build:installer --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Installer und Update-Dateien prüfen
        if: runner.os == 'Windows'
        run: node scripts/verify-release.mjs
      - name: Installation und Erhalt vorhandener Daten prüfen
        if: runner.os == 'Windows'
        run: ./scripts/test-installer.ps1
      - name: Installierte Studio-Oberfläche starten
        if: runner.os == 'Windows'
        run: ./scripts/test-desktop-start.ps1
      - name: Kompatibilitätsinformationen prüfen
        if: runner.os == 'Windows'
        run: node scripts/release-metadata.mjs

  tv:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fire-OS-App bauen
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          python3 scripts/build-tv.py
      - uses: actions/upload-artifact@v4
        with:
          name: neon-trinity-tv-build
          path: |
            release-tv/Neon-Trinity-TV-unsigned.apk
            release-tv/apksigner.jar
          retention-days: 7
