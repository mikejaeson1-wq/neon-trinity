name: Windows-Installer veröffentlichen
on:
  push:
    branches: [main]
    paths: [package.json, pnpm-lock.yaml, scripts/**, .github/workflows/windows-release.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Paketmanager installieren
        run: npm install --global pnpm@11.25.0
      - name: Abhängigkeiten aus Lockfile installieren
        run: pnpm install --frozen-lockfile
      - name: TV-Paket und plattformunabhängige Quellcodeprüfung
        run: node scripts/prepare-tv-release.mjs
      - name: Studio testen
        run: pnpm test
      - name: Windows-Setup bauen
        run: pnpm run build:installer --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
      - name: Installer und Update-Kanal prüfen
        run: node scripts/verify-release.mjs
      - name: Installation und Erhalt lokaler Daten prüfen
        run: ./scripts/test-installer.ps1
      - name: Installierte Studio-Oberfläche starten
        run: ./scripts/test-desktop-start.ps1
      - name: Signatur und sichere Wiederherstellung dokumentieren
        run: node scripts/release-metadata.mjs
        env:
          NEON_REQUIRE_SIGNATURE: ${{ secrets.WIN_CSC_LINK != '' || secrets.AZURE_CLIENT_SECRET != '' }}
      - name: Neue Version bereitstellen
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
